name: Qualify and deploy HUNT planner
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hunt-planner-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cargo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust and bindings
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy,rust-docs --target wasm32-unknown-unknown
          rustup default 1.95.0
          curl -fsSL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.127/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl.tar.gz -o /tmp/hunt-bindgen.tar.gz
          echo '61d4a7dc85acfa0d2354ccc0b8361928c7e52a746d17f28ebaa795ed3dc1614a  /tmp/hunt-bindgen.tar.gz' | sha256sum --check
          tar -xzf /tmp/hunt-bindgen.tar.gz -C /tmp
      - name: Guard extraction and qualify native adapters
        run: |
          python browser/planner/verify-foundation.py
          pwsh -NoProfile -File tests/check-pitfall-policy.ps1
          cargo fmt --manifest-path tools/hunt-sim/Cargo.toml -- --check
          cargo fmt --manifest-path tools/hunt-sim/core/Cargo.toml -- --check
          cargo fmt --manifest-path browser/planner/Cargo.toml -- --check
          cargo test --locked --manifest-path tools/hunt-sim/Cargo.toml
          python tools/hunt-sim/verify-native-controls.py
          cargo clippy --locked --manifest-path tools/hunt-sim/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path browser/planner/Cargo.toml
          cargo clippy --locked --manifest-path browser/planner/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path browser/planner/Cargo.toml --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Build and stage exact portable software release
        run: |
          python browser/planner/build-prototype.py --bindgen /tmp/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl/wasm-bindgen
          python browser/planner/verify-prototype-custody.py
          python browser/planner/package-site.py
          python browser/planner/verify-site.py target/hunt-release/HUNT --commit "$(git rev-parse HEAD)"
      - name: Exercise actual WASM worker
        working-directory: browser/planner
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:pages
      - name: Rebuild delivered portable source outside Git
        run: python browser/planner/verify-source.py --site target/hunt-release/HUNT --bindgen /tmp/wasm-bindgen-0.2.127-x86_64-unknown-linux-musl/wasm-bindgen
      - name: Retain exact artifact and scoped evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hunt-planner-qualification
          include-hidden-files: true
          path: |
            target/hunt-release/
            browser/planner/.cache/
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: hunt-planner-qualification
          path: .
      - name: Verify transferred exact source and artifact
        run: python browser/planner/verify-site.py target/hunt-release/HUNT --commit "${{ github.sha }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/hunt-release/HUNT
      - name: Deploy only the tested public tree
        id: deployment
        uses: actions/deploy-pages@v4
